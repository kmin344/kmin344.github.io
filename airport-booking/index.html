<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공항 픽업·투어 예약 서버 로직 데모 — 환율 고정·마감 검증·부분 환불·권한 분리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202b;--mut:#6b7783;--line:#e3e8ed;--bg:#fff;--soft:#f6f8fa;--ac:#0b6e6e;--acs:#e5f3f3;--bad:#b3261e;--ok:#1b7f45;--warn:#9a6700}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55}
.demo{background:#14202b;color:#fff;font-size:12px;text-align:center;padding:6px 12px}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:-.02em}.logo b{color:var(--ac)}
nav{display:flex;gap:4px;margin-left:12px}
nav button{border:0;background:none;padding:8px 14px;font:inherit;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:700}
.sp{flex:1}
select,input{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
select:focus,input:focus{outline:2px solid var(--acs);border-color:var(--ac)}
main{max-width:1080px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 20px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.f .w{grid-column:1/-1}.f select,.f input{width:100%}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;background:#fff}
.card+.card{margin-top:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.row span:first-child{color:var(--mut)}
.tot{font-size:20px;font-weight:700;color:var(--ac)}
.btn{border:0;border-radius:8px;background:var(--ac);color:#fff;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.s{padding:5px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.pay label{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;cursor:pointer;font-size:12px}
.pay input{display:none}.pay label.on{border-color:var(--ac);background:var(--acs);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut)}
.tag.ok{background:#e4f4ea;color:var(--ok)}.tag.bad{background:#fbe9e7;color:var(--bad)}.tag.w{background:#fff3d6;color:var(--warn)}
.msg{font-size:12.5px;padding:9px 11px;border-radius:8px;margin-top:10px}.msg.ok{background:#e4f4ea;color:var(--ok)}.msg.bad{background:#fbe9e7;color:var(--bad)}.msg.i{background:var(--soft);color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;color:var(--mut);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.log{font-size:12px;color:var(--mut);max-height:190px;overflow:auto}.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mono{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.lock{color:var(--mut);font-size:12px;padding:10px;border:1px dashed var(--line);border-radius:8px}
</style>
</head>
<body>
<div class="demo">자체 제작 데모 — 가상 데이터, 실제 고객사 프로젝트 아님 · 결제·메시지는 시뮬레이션이며 실제 PG·알림톡·LINE과 연동되지 않습니다</div>
<header>
  <div class="logo">Haneul<b>Ride</b></div>
  <nav><button id="tabC" class="on">고객 예약 / Booking</button><button id="tabA">관리자</button></nav>
  <div class="sp"></div>
  <select id="lang"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="tw">繁體中文</option><option value="cn">简体中文</option></select>
  <select id="cur"><option>KRW</option><option>USD</option><option>JPY</option><option>TWD</option><option>CNY</option></select>
</header>
<main>
<section id="cust">
  <h1 id="tTitle"></h1><p class="sub" id="tSub"></p>
  <div class="grid">
    <div>
      <div class="card">
        <div class="f">
          <div class="w"><label id="lProd"></label><select id="prod"></select></div>
          <div><label id="lDate"></label><input type="date" id="date" value="2026-12-03" min="2026-11-27"></div>
          <div><label id="lTime"></label><input type="time" id="time" value="14:30"></div>
          <div><label id="lTrip"></label><select id="trip"></select></div>
          <div></div>
          <div><label id="lPax"></label><input type="number" id="pax" min="1" max="12" value="2"></div>
          <div><label id="lLug"></label><input type="number" id="lug" min="0" max="12" value="3"></div>
        </div>
      </div>
      <div class="card">
        <h2 id="lPayM"></h2>
        <div class="pay" id="pay"></div>
        <button class="btn" id="book" style="width:100%"></button>
        <div id="bmsg"></div>
      </div>
    </div>
    <div>
      <div class="card" id="quote"></div>
      <div class="card">
        <h2 id="lSrv"></h2>
        <p class="sub" style="margin-bottom:10px" id="tSrv"></p>
        <button class="btn g s" id="tamper"></button>
        <div id="smsg"></div>
      </div>
    </div>
  </div>
</section>

<section id="adm" class="hide">
  <h1>운영 관리자</h1><p class="sub">예약·입금·기사 배정·정산을 한 화면에서 처리합니다. 권한에 따라 보이는 메뉴가 달라집니다.</p>
  <div class="tools">
    <span class="tag">로그인 권한</span>
    <select id="role"><option value="full">전체 관리 (2단계 인증 완료)</option><option value="ops">운영 담당</option></select>
    <button class="btn g s" id="expire">기한 경과 미입금 일괄 취소</button>
    <button class="btn g s" id="csv">월별 정산 CSV</button>
    <button class="btn g s" id="rate">USD 환율 +3% 반영</button>
    <span class="tag" id="rateNow"></span>
  </div>
  <div class="card" style="padding:6px 12px 12px"><table id="rtab"></table></div>
  <div class="grid" style="margin-top:14px">
    <div class="card"><h2>변경 이력</h2><div class="log" id="log"></div></div>
    <div class="card"><h2>권한 범위</h2>
      <div class="row"><span>예약 조회·입금 처리·기사 배정</span><span>전체 / 운영</span></div>
      <div class="row"><span>부분 환불·정산 CSV·환율 설정</span><span>전체 관리만</span></div>
      <div class="row"><span>모든 변경</span><span>이력 자동 기록</span></div>
      <div id="rolemsg" class="msg i" style="margin-top:10px"></div>
    </div>
  </div>
</section>
</main>

 var tv=g('trip').value||'pickup';var tp=PRODS[g('prod').value].tour;
 g('trip').innerHTML=tp?'<option value="tour">'+PRODS.p3[L]+'</option>':'<option value="pickup">'+t('pickup')+'</option><option value="send">'+t('send')+'</option><option value="round">'+t('round')+'</option>';
 if(!tp)g('trip').value=tv==='tour'?'pickup':tv;
 g('pay').innerHTML=PAYS.map(function(p){return '<label class="'+(S.pay===p[0]?'on':'')+'"><input type="radio" name="pm" value="'+p[0]+'">'+PAYL[p[0]][L]+'</label>'}).join('');
 [].forEach.call(document.querySelectorAll('#pay input'),function(e){e.onclick=function(){S.pay=e.value;render()}});
 quote();
}
function quote(){
 var i=cur();var r=serverCalc(i);var q=g('quote');
 if(r.error){q.innerHTML='<h2>'+t('quote')+'</h2><div class="msg bad">'+t(r.error)+'</div>';g('book').disabled=true;return}
 g('book').disabled=false;var c=S.cur;var rate=S.rates[c];var ch=conv(r.total,c);
 var h='<h2>'+t('quote')+'</h2>';
 h+='<div class="row"><span>'+t('veh')+'</span><span>'+VEH[r.veh].n+' ('+VEH[r.veh].pax+'/'+VEH[r.veh].lug+')</span></div>';
 h+='<div class="row"><span>'+t('base')+'</span><span class="mono">'+won(r.base)+'</span></div>';
 if(r.night)h+='<div class="row"><span>'+t('night')+'</span><span class="mono">+'+won(r.night)+'</span></div>';
 if(r.disc)h+='<div class="row"><span>'+t('disc')+'</span><span class="mono">'+won(r.disc)+'</span></div>';
 h+='<div class="row"><span>'+t('total')+'</span><span class="mono">'+won(r.total)+'</span></div>';
 h+='<div class="row"><span>'+t('charge')+'</span><span class="tot mono">'+fmt(ch,c)+'</span></div>';
 if(c!=='KRW')h+='<div class="row"><span>'+t('locked')+'</span><span class="mono">1 '+c+' = ₩'+rate+'</span></div>';
 h+='<div class="row"><span>'+t('left')+'</span><span>'+slotsLeft(i.prod,i.date)+' / '+CAP+'</span></div>';
 q.innerHTML=h;
}
function addLog(who,m){var d=new Date(NOW.getTime()+9*3600000+S.log.length*60000);S.log.unshift([d.toISOString().slice(0,16).replace('T',' '),who,m])}
function book(tamper){
 var i=cur();var r=serverCalc(i);if(r.error)return;
 var clientTotal=tamper?Math.round(r.total*0.7):r.total;
 if(clientTotal!==r.total){g('smsg').innerHTML='<div class="msg bad">'+t('rej')+'<br><span class="mono">client '+won(clientTotal)+' ≠ server '+won(r.total)+'</span></div>';addLog('서버','금액 불일치 요청 거부 (client '+clientTotal+' / server '+r.total+')');return}
 var id='R-'+(S.seq++);var c=S.cur;var due=new Date(NOW.getTime()+86400000);
 var ds=due.getFullYear()+'-'+('0'+(due.getMonth()+1)).slice(-2)+'-'+('0'+due.getDate()).slice(-2)+' 10:00';
 S.res.push({id:id,name:'Guest',prod:i.prod,date:i.date,time:i.time,pax:i.pax,lug:i.lug,veh:r.veh,cur:c,rate:S.rates[c],krw:r.total,paid:0,status:'입금대기',driver:'',method:S.pay,refund:0,due:ds});
 addLog('고객',id+' 예약 접수 · 환율 고정 1 '+c+'='+S.rates[c]+'원');
 g('bmsg').innerHTML='<div class="msg ok">'+t('okb')+'<br>'+id+' · '+t('dead')+' '+ds+'</div>';g('smsg').innerHTML='';quote();
}
function renderAdmin(){
 var full=S.role==='full';
 g('rateNow').textContent='USD 1 = ₩'+S.rates.USD+' (신규 예약에만 적용)';
 g('csv').classList.toggle('hide',!full);g('rate').classList.toggle('hide',!full);
 g('rolemsg').textContent=full?'전체 관리: 모든 메뉴를 사용할 수 있습니다.':'운영 담당: 부분 환불·정산 CSV·환율 설정 메뉴는 보이지 않으며 서버에서도 요청이 거부됩니다.';
 var h='<tr><th>예약</th><th>상품 / 일시</th><th>고객</th><th>차량</th><th>결제 통화</th><th>청구(원)</th><th>입금</th><th>상태</th><th>기사</th><th>처리</th></tr>';
 S.res.forEach(function(r,ix){
  var bal=r.krw-r.paid;var cls=r.status==='확정'?'ok':(r.status==='취소'?'bad':'w');
  var charge=conv(r.krw,r.cur,r.rate);
  h+='<tr><td class="mono">'+r.id+'</td><td>'+PRODS[r.prod].ko+'<br><span style="color:var(--mut)">'+r.date+' '+r.time+'</span></td><td>'+r.name+'<br><span style="color:var(--mut)">'+r.pax+'인·짐'+r.lug+'</span></td><td>'+VEH[r.veh].n+'</td>'
  +'<td class="mono">'+fmt(charge,r.cur)+'<br><span style="color:var(--mut)">1='+r.rate+'원 고정</span></td><td class="mono">'+won(r.krw)+'</td><td class="mono">'+won(r.paid-r.refund)+'</td><td><span class="tag '+cls+'">'+r.status+'</span>'+(r.status==='입금대기'?'<br><span style="color:var(--mut)">~'+r.due+'</span>':'')+'</td>'
  +'<td><select data-d="'+ix+'" '+(r.status==='취소'?'disabled':'')+'><option value="">미배정</option><option'+(r.driver==='김기사'?' selected':'')+'>김기사</option><option'+(r.driver==='이기사'?' selected':'')+'>이기사</option><option'+(r.driver==='박기사'?' selected':'')+'>박기사</option></select></td>'
  +'<td style="white-space:nowrap">'+(r.status==='입금대기'?'<button class="btn s" data-p="'+ix+'">전액 입금</button> <button class="btn g s" data-h="'+ix+'">절반 입금</button>':'')+(r.status==='확정'&&full?'<button class="btn g s" data-r="'+ix+'">부분 환불 20%</button>':'')+'</td></tr>';
 });
 g('rtab').innerHTML=h;
 g('log').innerHTML=S.log.map(function(l){return '<div>'+l[0]+' · '+l[1]+' · '+l[2]+'</div>'}).join('');
 [].forEach.call(document.querySelectorAll('[data-d]'),function(e){e.onchange=function(){var r=S.res[e.dataset.d];r.driver=e.value;addLog(S.role==='full'?'전체 관리':'운영 담당',r.id+' 기사 배정 → '+(e.value||'해제'));renderAdmin()}});
 [].forEach.call(document.querySelectorAll('[data-p]'),function(e){e.onclick=function(){payIn(e.dataset.p,1)}});
 [].forEach.call(document.querySelectorAll('[data-h]'),function(e){e.onclick=function(){payIn(e.dataset.h,0.5)}});
 [].forEach.call(document.querySelectorAll('[data-r]'),function(e){e.onclick=function(){var r=S.res[e.dataset.r];var amt=Math.round(r.krw*0.2);r.refund+=amt;addLog('전체 관리',r.id+' 부분 환불 '+won(amt)+' (남은 결제액 '+won(r.paid-r.refund)+', 예약 유지)');renderAdmin()}});
}
function payIn(ix,ratio){var r=S.res[ix];var add=Math.round((r.krw-r.paid)*ratio);r.paid+=add;if(r.paid>=r.krw){r.status='확정';addLog('결제 서버 검증',r.id+' 전액 입금 확인 → 예약 자동 확정')}else{addLog('결제 서버 검증',r.id+' 부분 입금 '+won(add)+' · 잔액 '+won(r.krw-r.paid)+' 남음 (확정 보류)')}renderAdmin()}
g('lang').onchange=function(){S.lang=this.value;render()};
g('cur').onchange=function(){S.cur=this.value;quote()};
['prod','date','time','trip','pax','lug'].forEach(function(id){g(id).onchange=function(){if(id==='prod')render();else quote()};g(id).oninput=function(){if(id!=='prod')quote()}});
g('book').onclick=function(){book(false)};g('tamper').onclick=function(){book(true)};
g('tabC').onclick=function(){g('cust').classList.remove('hide');g('adm').classList.add('hide');g('tabC').classList.add('on');g('tabA').classList.remove('on');quote()};
g('tabA').onclick=function(){g('adm').classList.remove('hide');g('cust').classList.add('hide');g('tabA').classList.add('on');g('tabC').classList.remove('on');renderAdmin()};
g('role').onchange=function(){S.role=this.value;addLog('시스템','권한 전환 → '+(S.role==='full'?'전체 관리':'운영 담당'));renderAdmin()};
g('expire').onclick=function(){var n=0;S.res.forEach(function(r){if(r.status==='입금대기'&&new Date(r.due.replace(' ','T')+':00+09:00')<NOW){r.status='취소';n++;addLog('시스템',r.id+' 입금 기한 경과 → 자동 취소')}});if(!n)addLog('시스템','취소 대상 없음');renderAdmin()};
g('rate').onclick=function(){S.rates.USD=Math.round(S.rates.USD*1.03);addLog('전체 관리','USD 환율 변경 → '+S.rates.USD+' (기존 예약 환율은 그대로 유지)');renderAdmin()};
g('csv').onclick=function(){var rows=[['예약','상품','일자','기사','청구(원)','입금(원)','환불(원)','순입금(원)']];S.res.forEach(function(r){if(r.status!=='취소')rows.push([r.id,PRODS[r.prod].ko,r.date,r.driver,r.krw,r.paid,r.refund,r.paid-r.refund])});var s='﻿'+rows.map(function(x){return x.join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='settlement-2026-12.csv';a.click();addLog('전체 관리','월별·기사별 정산 CSV 내보내기')};
render();
</script>
</body>
</html>
